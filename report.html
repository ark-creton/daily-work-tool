<div class="container-fluid p-4 d-flex flex-column" style="min-height: 100%">
  <div
    class="d-flex justify-content-between align-items-end mb-4 flex-shrink-0"
  >
    <div>
      <h2 class="h4 mb-1 fw-bold page-title">レポート管理</h2>
      <p class="text-muted small mb-0">
        日々の業務レポートの新規作成、編集、および過去のレポートの確認を行えます。
      </p>
    </div>

    <div class="d-flex gap-2">
      <select
        id="target_user_id"
        class="form-select filter-control"
        style="width: auto"
      >
        <option value="">表示対象ユーザー</option>
      </select>
      <input
        type="month"
        id="display_period"
        class="form-control filter-control"
        style="width: auto"
      />
    </div>
  </div>

  <div class="row g-4 flex-grow-1" style="min-height: 0">
    <div class="col-lg-8 d-flex flex-column">
      <div class="card border-0 shadow-sm p-4 table-card report-detail-card">
        <div
          class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0"
        >
          <div class="d-flex align-items-baseline gap-2">
            <h3 class="fs-5 fw-bold text-value m-0">詳細内容</h3>
            <span class="text-muted small fw-normal"
              >（選択したレポートの内容が表示されます）</span
            >
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary">新規作成</button>
            <button class="btn btn-sm btn-outline-secondary">編集</button>
          </div>
        </div>

        <div
          class="report-content-body border-top border-bottom py-3 text-center"
        >
          <div
            class="text-muted py-4 px-2 h-100 d-flex flex-column align-items-center justify-content-center"
          >
            <i
              class="bi bi-file-earmark-text d-block fs-2 mb-2 text-black-50"
            ></i>
            <p class="mb-1 fw-bold text-value">
              提出されたレポートがありません
            </p>
            <p class="small mb-0 text-black-50 text-wrap">
              「新規作成」ボタンから、本日の業務レポートを作成してください。
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4 d-flex flex-column gap-4">
      <div class="card border-0 shadow-sm p-4 table-card flex-shrink-0">
        <h4 class="fs-6 fw-bold mb-3 text-value">カレンダー</h4>
        <div
          class="bg-light rounded d-flex align-items-center justify-content-center"
          style="height: 180px"
        >
          <span class="text-muted small">カレンダー表示エリア</span>
        </div>
      </div>

      <div class="card border-0 shadow-sm p-4 table-card report-list-card">
        <h4 class="fs-6 fw-bold mb-3 text-value flex-shrink-0">
          過去の提出一覧
        </h4>
        <div class="report-list-scroll-container">
          <ul class="list-unstyled mb-0">
            <li class="mb-2 small"><a href="#">2026/05/20 のレポート</a></li>
            <li class="mb-2 small"><a href="#">2026/05/19 のレポート</a></li>
            <li class="mb-2 small"><a href="#">2026/05/18 のレポート</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

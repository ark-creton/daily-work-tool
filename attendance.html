<div class="container-fluid p-4">
  <!-- ヘッダーエリア -->
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap row-gap-3">
    <div>
      <h2 class="h4 mb-1 fw-bold page-title">勤怠管理</h2>
      <p class="text-muted small mb-0">月間の労働日数、総勤務時間、時間外労働の集計確認、および勤務内容の修正を行えます。</p>
    </div>

    <div class="d-flex gap-2">
      <select id="target_user_id" class="form-select filter-control shadow-sm">
        <option value="">表示対象ユーザー</option>
      </select>
      <input type="month" id="display_period" class="form-control filter-control shadow-sm" />
    </div>
  </div>

  <!-- サマリーエリア（レスポンシブ＆高さ揃えを最適化） -->
  <div class="summary-wrapper mb-4 p-3 bg-white rounded-3 border shadow-sm">
    <div class="row g-2 align-items-stretch">

      <!-- 労働日数 -->
      <div class="col-6 col-md">
        <div class="summary-box h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">労働日数</span>
          <div class="summary-value">
            <span id="work_days_count" class="num">-</span><span class="unit">日</span>
          </div>
        </div>
      </div>

      <!-- 総勤務時間（ハイライト表示） -->
      <div class="col-6 col-md">
        <div class="summary-box highlight-primary h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">総勤務時間</span>
          <div class="summary-value">
            <span id="total_work_hours" class="num">-</span><span class="unit">h</span>
            <span id="total_work_minutes" class="num">-</span><span class="unit">m</span>
          </div>
        </div>
      </div>

      <!-- 時間外労働（注意ハイライト） -->
      <div class="col-6 col-md">
        <div class="summary-box highlight-warning h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">時間外労働</span>
          <div class="summary-value">
            <span id="total_overtime_hours" class="num">-</span><span class="unit">h</span>
            <span id="total_overtime_minutes" class="num">-</span><span class="unit">m</span>
          </div>
        </div>
      </div>

      <!-- 外出時間数 -->
      <div class="col-6 col-md">
        <div class="summary-box h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">外出時間</span>
          <div class="summary-value">
            <span id="total_out_hours" class="num">-</span><span class="unit">h</span>
            <span id="total_out_minutes" class="num">-</span><span class="unit">m</span>
          </div>
        </div>
      </div>

      <!-- 休日出勤日数 -->
      <div class="col-6 col-md">
        <div class="summary-box h-100 d-flex flex-column justify-content-center">
          <span class="summary-label d-flex justify-content-center align-items-center gap-1">
            休日出勤
            <i class="bi bi-question-circle text-muted" style="font-size: 0.7rem;" data-bs-toggle="popover"
              data-bs-content="法的・契約上の休日に打刻がある日数です。"></i>
          </span>
          <div class="summary-value">
            <span id="holiday_work_days" class="num">0</span><span class="unit">日</span>
          </div>
        </div>
      </div>

      <!-- 有給取得日数 -->
      <div class="col-6 col-md">
        <div class="summary-box h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">有給取得</span>
          <div class="summary-value">
            <span id="paid_leave_days" class="num">0</span><span class="unit">日</span>
          </div>
        </div>
      </div>

      <!-- 経費合計 -->
      <div class="col-12 col-md">
        <div class="summary-box h-100 d-flex flex-column justify-content-center">
          <span class="summary-label">経費合計</span>
          <div class="summary-value">
            <span id="total_expense_fee" class="num">0</span><span class="unit">円</span>
          </div>
          <div id="expense_breakdown" class="text-muted extra-small"
            style="font-size: 0.65rem; line-height: 1.1; margin-top: 1px;">
            交通費:0 / 他:0
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- テーブルエリア -->
  <div class="card border-0 shadow-sm p-4 table-card rounded-3">
    <div class="mb-3 d-flex justify-content-between align-items-center">
      <h3 class="fs-5 fw-bold text-value m-0">月間勤務表</h3>

      <div class="btn-group" role="group" aria-label="表示切り替え">
        <button type="button" id="view_mode_list" class="btn btn-outline-secondary btn-sm active">
          <i class="bi bi-list-task me-1"></i>一覧
        </button>
        <button type="button" id="view_mode_calendar" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-grid-3x3-gap me-1"></i>カレンダー
        </button>
      </div>
    </div>

    <div id="list_view_wrapper" class="table-responsive table-scroll-container">
      <table class="table table-hover align-middle mb-0" id="attendance_table">
        <thead class="table-light sticky-top table-header-area">
          <tr>
            <th class="cell-action text-center">操作</th>
            <th class="cell-date">日付</th>
            <th class="text-center">勤務時間</th>
            <th class="text-center">総勤務</th>
            <th class="text-center">時間外</th>
            <th class="text-center">休憩(分)</th>
            <th class="text-center">外出</th>
            <th class="text-center cell-expense">経費明細</th>
            <th class="cell-memo">備考</th>
          </tr>
        </thead>
        <tbody id="attendance_tbody" class="table-body-area">
          <tr>
            <td colspan="9" class="text-center"
              style="padding-top: 80px !important; padding-bottom: 80px !important; border: none; background-color: #ffffff">
              <div class="text-muted h-100 d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-calendar-check d-block fs-2 mb-2 text-black-50"></i>
                <p class="mb-1 fw-bold text-value">表示する勤務データがありません</p>
                <p class="small mb-0 text-black-50 text-wrap">対象の期間を選択するか、初期設定を行ってください。</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="calendar_view_wrapper" class="d-none at-calendar-scroll-container">
      <div class="at-calendar-week-header at-calendar-grid">
        <div class="text-danger">日</div>
        <div class="text-muted">月</div>
        <div class="text-muted">火</div>
        <div class="text-muted">水</div>
        <div class="text-muted">木</div>
        <div class="text-muted">金</div>
        <div class="text-primary">土</div>
      </div>
      <div id="calendar_grid" class="at-calendar-grid"></div>
    </div>
  </div>
</div>

<div id="modal_container"></div>

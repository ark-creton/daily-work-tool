<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap row-gap-3">
    <div>
      <h2 class="h4 mb-1 fw-bold page-title">勤怠管理</h2>
      <p class="text-muted small mb-0">月間の労働日数、総勤務時間、時間外労働の集計確認、および勤務内容の修正を行えます。</p>
    </div>

    <div class="d-flex gap-2">
      <select id="target_user_id" class="form-select filter-control">
        <option value="">表示対象ユーザー</option>
      </select>
      <input type="month" id="display_period" class="form-control filter-control" />
    </div>
  </div>

  <div class="card border-0 shadow-sm p-4 mb-4 summary-card">
    <div class="d-flex flex-wrap align-items-center summary-container">
      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">労働日数</span>
        <div>
          <span id="work_days_count" class="h4 fw-bold mb-0 text-value">-</span>
          <span class="text-muted small">日</span>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">総勤務時間</span>
        <div>
          <span id="total_work_hours" class="h4 fw-bold mb-0 text-value">-</span>
          <span class="text-muted small">時間</span>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">時間外労働</span>
        <div>
          <span id="total_overtime_hours" class="h4 fw-bold mb-0 text-value">-</span>
          <span class="text-muted small">時間</span>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">外出時間数</span>
        <div>
          <span id="total_out_hours" class="h4 fw-bold mb-0 text-value">-</span>
          <span class="text-muted small">時間</span>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">休日出勤日数</span>
        <div>
          <span id="holiday_work_days" class="h4 fw-bold mb-0 text-value">0</span>
          <span class="text-muted small">日</span>
          <span
            class="help-icon ms-1"
            data-bs-toggle="popover"
            data-bs-content="法的、契約上の会社の休日、およびカレンダー上の祝日に打刻（出勤・退勤の両方）がある日数を集計しています。"
            tabindex="0"
            style="cursor: pointer"
          >
            <i class="bi bi-question-circle text-muted" style="font-size: 0.85rem"></i>
          </span>
        </div>
      </div>

      <div class="v-divider-dashed"></div>

      <div class="d-flex align-items-baseline gap-2">
        <span class="small fw-bold text-label">経費合計</span>
        <div>
          <span id="total_expense_fee" class="h4 fw-bold mb-0 text-value">0</span>
          <span class="text-muted small">円</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm p-4 table-card">
    <div class="mb-3">
      <h3 class="fs-5 fw-bold text-value m-0">月間勤務表</h3>
    </div>

    <div class="table-responsive table-scroll-container">
      <table class="table table-hover align-middle mb-0" id="attendance_table">
        <thead class="table-light sticky-top table-header-area">
          <tr>
            <th class="cell-action text-center">操作</th>
            <th class="cell-date">日付</th>
            <th class="text-center">勤務時間</th>
            <th class="text-center">総勤務</th>
            <th class="text-center">時間外</th>
            <th class="text-center">休憩(分)</th>
            <th class="text-center">外出</th>
            <th class="text-center cell-expense">経費明細</th>
            <th class="cell-memo">備考</th>
          </tr>
        </thead>
        <tbody id="attendance_tbody" class="table-body-area">
          <tr>
            <td
              colspan="8"
              class="text-center"
              style="padding-top: 100px !important; padding-bottom: 100px !important; border: none; background-color: #ffffff"
            >
              <div class="text-muted h-100 d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-calendar-check d-block fs-2 mb-2 text-black-50"></i>

                <p class="mb-1 fw-bold text-value">表示する勤務データがありません</p>

                <p class="small mb-0 text-black-50 text-wrap">対象の期間を選択するか、初期設定を行ってください。</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="modal_container"></div>

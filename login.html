<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン - 勤怠レポートシステム</title>

    <!-- Google Fonts (Noto Sans JP) の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons の読み込み -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- 1. 共通の土台 -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- 2. ログイン画面専用の装飾 -->
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 text-center">
          <p class="system-name">勤怠レポートシステム</p>
          <h1 class="login-title mb-4">ログイン</h1>

          <div class="card shadow-sm p-4 text-start">
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">メールアドレス</label>
                <input
                  type="email"
                  class="form-control text-secondary"
                  id="email"
                  placeholder="example@mail.com"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">パスワード</label>
                <div class="input-group" id="password-group">
                  <input
                    type="password"
                    class="form-control text-secondary rounded-end-0 border-end-0"
                    id="password"
                    placeholder="••••••••"
                    required
                  />
                  <button
                    class="btn border-start-0 rounded-start-0"
                    type="button"
                    id="toggle_password"
                    style="background-color: #ffffff; border-color: #dee2e6"
                  >
                    <i class="bi bi-eye text-secondary"></i>
                  </button>
                </div>
              </div>

              <div
                id="errorMessage"
                class="text-danger text-sm mb-2 text-center"
                style="display: none"
              >
                <!-- ここにJSでメッセージを流し込みます -->
              </div>

              <button type="submit" class="btn w-100 py-2 mb-3" id="loginBtn">
                ログイン
              </button>

              <div class="mt-3 text-center text-secondary">
                <small
                  >※新規登録・パスワードを忘れた方は、<br />
                  システム管理者までお問い合わせください。</small
                >
              </div>
            </form>
          </div>

          <p class="mt-4 text-secondary small">© 2026 ARC CRETON Inc.</p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="js/login.js"></script>
  </body>
</html>

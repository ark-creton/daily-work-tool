<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勤怠レポートシステム</title>

    <!-- Google Fonts (Noto Sans JP) の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons の読み込み -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- 1. css　の読み込み -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/attendance.css" />
    <link rel="stylesheet" href="css/report.css" />
  </head>
  <body>
    <!-- ローディング -->
    <div id="global-loading">
      <div class="text-center">
        <div class="dots-container mb-3">
          <div class="hyokkori-dot dot-1"></div>
          <div class="hyokkori-dot dot-2"></div>
          <div class="hyokkori-dot dot-3"></div>
        </div>
        <div class="loading-text">読み込み中...</div>
      </div>
    </div>

    <div class="app-container">
      <!-- エリア1：左サイドバー -->
      <aside class="sidebar-area" id="sidebar">
        <!-- サイドバーのハンバーガーボタン -->
        <div class="sidebar-header">
          <button id="menu-toggle" class="icon-btn">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </aside>

      <!-- メニューリスト -->
      <nav class="sidebar-nav">
        <div class="sidebar-user-info">
          <i class="bi bi-person-circle"></i>
          <span class="sidebar-user-name">ユーザー名</span>
        </div>
        <ul>
          <li class="nav-item" data-page="home" data-title="メイン">
            <i class="bi bi-house-door"></i>
            <span class="nav-text">メイン</span>
          </li>
          <li class="nav-item" data-page="attendance" data-title="勤怠">
            <i class="bi bi-clock"></i>
            <span class="nav-text">勤怠</span>
          </li>
          <li class="nav-item" data-page="report" data-title="レポート">
            <i class="bi bi-file-earmark-text"></i>
            <span class="nav-text">レポート</span>
          </li>
          <li
            class="nav-item"
            id="menu_admin"
            data-page="admin"
            data-title="管理者専用"
          >
            <i class="bi bi-person-gear"></i>
            <span class="nav-text">管理者専用</span>
          </li>
          <li class="nav-item mobile-logout-item">
            <i class="bi bi-box-arrow-right"></i>
            <span class="nav-text">ログアウト</span>
          </li>
        </ul>
      </nav>

      <!-- 右側のグループ -->
      <div class="main-layout">
        <!-- エリア2：上部ヘッダー -->
        <header class="header-area">
          <!-- 左側:システム名(①)-->
          <div class="header-left">
            <span class="system-name">勤怠レポートシステム</span>
          </div>

          <!-- 右側:ユーザ名とログアウト(②・③)-->
          <div class="header-right">
            <span class="user-name">ユーザー名</span>

            <!-- スマホ用ハンバーガメニュー -->
            <button id="mobile-menu-toggle" class="mobile-toggle-btn">
              <i class="bi bi-list"></i>
            </button>

            <button class="logout-btn">ログアウト</button>
          </div>
        </header>

        <!-- エリア3：メインコンテンツ -->
        <main class="content-area" id="main_content_dynamic_area">
          <div class="dashboard-container"></div>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="js/common.js"></script>

    <script src="js/main.js"></script>
    <script src="js/attendance.js"></script>
    <script src="js/admin.js"></script>

    <script src="js/index.js"></script>
  </body>
</html>

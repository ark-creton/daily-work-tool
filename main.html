<div class="dashboard-container">
  <div class="status-clock-section">
    <div class="clock-card">
      <div class="card-header-title">
        <span id="current_date_display" class="date-display">2026年5月18日(月)</span>
        <span id="current_status_label" class="status-badge status-default">未出勤</span>
      </div>
      <div id="current_time_display" class="time-display">00:00:00</div>
    </div>

    <div class="button-group-card">
      <div class="action-buttons-top">
        <button id="clock_in_button" class="btn btn-clock-in">出勤</button>
        <button id="clock_out_button" class="btn btn-clock-out" disabled>退勤</button>
      </div>
      <div class="action-buttons-bottom">
        <button id="break_toggle_button" class="btn btn-break" disabled>外出開始</button>
      </div>

      <div class="today-remarks-area">
        <div class="remarks-input-group d-flex gap-2 align-items-center">
          <input
            type="text"
            id="today_remarks_input"
            class="form-control remarks-input"
            placeholder="本日の備考を入力"
            maxlength="100"
            autocomplete="off"
          />
          <button id="btn_save_remarks" class="btn btn-save-remarks">保存</button>

          <button
            id="btn_open_expense_modal"
            class="btn btn-outline-primary btn-expense-trigger d-flex align-items-center gap-1"
            data-bs-target="#expenseEntryModal"
          >
            <i class="bi bi-currency-yen"></i>経費登録
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="logs-section">
    <div class="section-title">
      <span>直近の打刻内容（勤怠ログ）</span>
    </div>
    <div id="collapseLogs">
      <textarea
        id="recent_logs_area"
        class="form-control logs-textarea mt-2"
        readonly
        rows="4"
        placeholder="打刻履歴や備考の保存ログがここに表示されます"
      ></textarea>
    </div>
  </div>

  <div class="content-grid-section">
    <div class="grid-card">
      <div class="card-header-toggle d-flex justify-content-between align-items-center">
        <span class="fw-bold" style="font-size: 1rem; color: #55555c">カレンダー</span>

        <div class="calendar-selector-wrapper d-flex align-items-center gap-2">
          <select id="calendar-month-selector" class="form-select form-select-sm" style="width: auto"></select>
        </div>
      </div>

      <div id="collapseCalendar" class="w-100 h-100 d-flex flex-column">
        <div class="card-body-content pt-2">
          <div class="custom-calendar">
            <div class="calendar-weekdays">
              <div>日</div>
              <div>月</div>
              <div>火</div>
              <div>水</div>
              <div>木</div>
              <div>金</div>
              <div>土</div>
            </div>
            <div id="calendar-days"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-card">
      <div class="card-header-toggle d-flex justify-content-between align-items-center">
        <span class="fw-bold" style="font-size: 1rem; color: #55555c">過去のレポート</span>

        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-sm btn-create-report">＋ 新規作成</button>
          <select class="form-select form-select-sm" style="width: auto">
            <option>5件</option>
          </select>
        </div>
      </div>

      <div id="collapseReports" class="w-100">
        <div class="card-body-content pt-2"></div>
      </div>
    </div>
  </div>
</div>

<div class="dashboard-container container-fluid p-3 p-md-4">
  <div class="main-top-split-layout">
    <div class="left-content-group">
      <div class="clock-card">
        <div class="card-header-title">
          <span id="current_date_display" class="date-display">2026年5月18日(月)</span>
          <span id="current_status_label" class="status-badge status-default">未出勤</span>
        </div>
        <div id="current_time_display" class="time-display">00:00:00</div>
      </div>

      <div class="news-section-bordered">
        <div class="section-title">お知らせ</div>

        <div class="news-body mt-2">
          <div class="news-item">
            <span class="news-date">2026/07/10</span>
            <span class="news-text">勤怠レポートシステムのレイアウトをリニューアルしました。</span>
          </div>
        </div>
      </div>
    </div>

    <div class="right-content-group">
      <div class="button-group-card">
        <div class="action-buttons-top">
          <button id="clock_in_button" class="btn btn-clock-in">出勤</button>
          <button id="clock_out_button" class="btn btn-clock-out" disabled>退勤</button>
        </div>
        <div class="action-buttons-bottom">
          <button id="break_toggle_button" class="btn btn-break" disabled>外出開始</button>
        </div>
        <div class="today-remarks-area">
          <div class="remarks-input-group d-flex gap-2 align-items-center">
            <input type="text" id="today_remarks_input" class="form-control remarks-input" placeholder="本日の備考を入力"
              maxlength="100" autocomplete="off" />
            <button id="btn_save_remarks" class="btn btn-save-remarks">保存</button>
            <button id="btn_open_expense_modal"
              class="btn btn-outline-primary btn-expense-trigger d-flex align-items-center gap-1"
              data-bs-target="#expenseEntryModal">
              <i class="bi bi-currency-yen"></i>経費登録
            </button>
          </div>
        </div>
      </div>
      <div class="logs-section">
        <div class="section-title"><span>直近の打刻内容（勤怠ログ）</span></div>
        <div id="collapseLogs">
          <textarea id="recent_logs_area" class="form-control logs-textarea mt-2" readonly rows="4"
            placeholder="打刻履歴や備考の保存ログがここに表示されます"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="content-grid-section"
    style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; box-sizing: border-box">
    <div class="grid-card d-flex flex-column" style="padding: 12px 16px; height: 260px; box-sizing: border-box">
      <div class="card-header-toggle d-flex justify-content-between align-items-center"
        style="height: 32px; margin-bottom: 4px; flex-shrink: 0">
        <div class="section-title"><span>カレンダー</span></div>
        <div class="calendar-selector-wrapper d-flex align-items-center gap-2">
          <select id="calendar-month-selector" class="form-select form-select-sm"
            style="width: auto; margin: 0"></select>
        </div>
      </div>
      <div class="custom-calendar d-flex flex-column" style="flex-grow: 1; min-height: 0; width: 100%">
        <div class="calendar-weekdays">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>
        <div id="calendar-days"></div>
      </div>
    </div>

    <div class="grid-card d-flex flex-column" style="padding: 12px 16px; height: 260px; box-sizing: border-box">
      <div class="d-flex justify-content-between align-items-center flex-shrink-0 flex-nowrap"
        style="height: 32px; margin-bottom: 4px">
        <div class="section-title flex-shrink-0" style="line-height: 32px"><span>過去のレポート</span></div>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button id="open-report-modal-btn" class="btn btn-sm btn-create-report">＋ 新規作成</button>
          <select id="target_user_id" class="form-select fw-normal text-secondary border-light-subtle"
            style="width: 155px; font-size: 0.75rem; height: auto; padding-top: 2px; padding-bottom: 2px"></select>
        </div>
      </div>
      <div class="main-report-scroll-box flex-grow-1"
        style="display: block !important; overflow-y: auto !important; padding-right: 4px; min-height: 0">
        <div id="past_report_list" class="card-body-content pt-1"></div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid p-4">
  <div class="mb-4">
    <h2 class="h4 mb-1 fw-bold text-dark d-flex align-items-center">
      管理者専用
      <span
        class="ms-2 help-icon d-md-none"
        tabindex="0"
        data-bs-toggle="popover"
        data-bs-trigger="focus"
        data-bs-content="従業員のアカウント開設、所属、権限の管理を行えます。"
      >
        <i class="bi bi-question-circle"></i>
      </span>
    </h2>

    <p class="text-muted small mb-0 d-none d-md-block">従業員のアカウント開設、所属、権限の管理を行えます。</p>
  </div>

  <div class="row g-3 mb-4 align-items-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="input-group bg-white shadow-sm rounded">
        <span class="input-group-text bg-transparent border-end-0 text-muted">
          <i class="bi bi-search"></i>
        </span>
        <input type="text" id="user_search_input" class="form-control border-start-0" placeholder="氏名、所属会社で検索..." />
      </div>
    </div>

    <div class="col-12 col-md-auto ms-md-auto text-end">
      <button type="button" id="user_new_button" class="btn d-inline-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-person-plus-fill"></i> 新規ユーザー登録
      </button>
    </div>
  </div>
  <div class="card bg-transparent border-0">
    <div class="card-body p-0">
      <div class="table-responsive d-none d-md-block bg-white shadow-sm rounded-3 admin-table-container">
        <table class="table table-hover align-middle mb-0" id="list_user_name">
          <thead class="table-light text-muted small">
            <tr>
              <th style="width: 6%">No</th>
              <th style="width: 24%">ユーザー</th>
              <th style="width: 28%">メールアドレス (ログインID)</th>
              <th style="width: 14%">権限</th>
              <th style="width: 14%">状態</th>
              <th style="width: 14%; text-align: center">操作</th>
            </tr>
          </thead>
          <tbody class="text-dark" id="user_list_tbody">
            <tr id="no_data_row">
              <td
                colspan="6"
                class="text-center"
                style="padding-top: 150px !important; padding-bottom: 150px !important; border: none; background-color: #ffffff"
              >
                <div class="text-muted h-100 d-flex flex-column align-items-center justify-content-center">
                  <i class="bi bi-people d-block fs-2 mb-2 text-black-50"></i>
                  <p class="mb-1 fw-bold text-value">登録されている従業員がいません</p>
                  <p class="small mb-0 text-black-50 text-wrap">「新規ユーザー登録」ボタンから最初のアカウント開設をしてください。</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-md-none p-0" id="user_list_mobile">
        <div
          id="no_data_mobile"
          class="text-center bg-white shadow-sm rounded-3"
          style="padding-top: 100px !important; padding-bottom: 100px !important"
        >
          <div class="text-muted h-100 d-flex flex-column align-items-center justify-content-center px-3">
            <i class="bi bi-people d-block fs-2 mb-2 text-black-50"></i>

            <p class="mb-1 fw-bold text-value">登録されている従業員がいません</p>

            <p class="small mb-0 text-black-50 text-wrap">「新規ユーザー登録」ボタンから最初のアカウント開設をしてください。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal_container"></div>
</div>

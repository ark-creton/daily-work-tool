<div
  class="modal fade"
  id="userModal"
  tabindex="-1"
  aria-labelledby="userModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold text-dark" id="userModalLabel">
          ユーザー情報を登録
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body px-4 py-4">
        <form id="user_form" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <label for="user_name" class="form-label"
                >氏名 <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="user_name"
                class="form-control"
                placeholder="例: 山田 太郎"
                required
              />
              <div class="invalid-feedback small">氏名を入力してください。</div>
            </div>

            <div class="col-12">
              <label for="company_id" class="form-label"
                >所属会社名 <span class="text-danger">*</span></label
              >
              <select id="company_id" class="form-select" required>
                <option value="" disabled selected>選択してください</option>
              </select>
              <div class="invalid-feedback small">
                所属会社を選択してください。
              </div>
            </div>

            <input
              type="hidden"
              id="avatar_url"
              value="assets/default-avatar.png"
            />

            <div class="col-12">
              <label for="login_email" class="form-label"
                >メールアドレス <span class="text-danger">*</span></label
              >
              <input
                type="email"
                id="login_email"
                class="form-control"
                placeholder="example@domain.com"
                required
              />
              <div class="invalid-feedback small">
                正しいメールアドレスを入力してください。
              </div>
            </div>

            <div class="col-12">
              <label for="password" class="form-label" id="password_label"
                >パスワード <span class="text-danger">*</span></label
              >

              <div
                class="input-group"
                style="
                  border: 1px solid #dee2e6;
                  border-radius: 0.375rem;
                  overflow: hidden;
                "
              >
                <input
                  type="password"
                  id="password"
                  class="form-control border-0 border-end-0"
                  placeholder="6〜20文字の半角英数字"
                  pattern="[a-zA-Z0-9]{6,20}"
                  minlength="6"
                  maxlength="20"
                  required
                  style="box-shadow: none"
                />
                <button
                  class="btn bg-white border-0 border-start-0 text-muted px-3"
                  type="button"
                  id="toggle_password_btn"
                  style="z-index: 4; box-shadow: none"
                >
                  <i class="bi bi-eye" id="toggle_password_icon"></i>
                </button>
              </div>

              <div
                class="mt-2"
                style="font-size: 0.75rem; color: #94a3b8; line-height: 1.4"
                id="password_help"
              >
                <i class="bi bi-info-circle-fill me-1"></i>
                新規登録時は必須。編集時は空欄で更新スキップ可能です。
              </div>
              <div class="invalid-feedback small">
                パスワードは6文字以上20文字以内の「半角英数字」で入力してください。
              </div>
            </div>

            <div class="col-12">
              <label for="role" class="form-label"
                >権限レベル <span class="text-danger">*</span></label
              >
              <select id="role" class="form-select" required>
                <option value="staff" selected>
                  一般ユーザー（自身の打刻・閲覧のみ）
                </option>
                <option value="admin">管理者（全ユーザーの管理が可能）</option>
              </select>
            </div>

            <div class="col-12">
              <label for="is_active" class="form-label fw-bold"
                >アカウント状態 <span class="text-danger">*</span></label
              >
              <select id="is_active" class="form-select" required>
                <option value="true" selected>
                  有効（ログイン可能・システム利用中）
                </option>
                <option value="false">無効（ログイン停止・退職者など）</option>
              </select>
            </div>

            <div class="col-12 mt-4" id="timestamps_area" style="display: none">
              <div
                class="p-3 bg-light rounded-3"
                style="font-size: 0.8rem; color: #64748b"
              >
                <div class="d-flex justify-content-between mb-1">
                  <span><i class="bi bi-plus-circle me-1"></i> 作成日時:</span>
                  <span id="created_at_text" class="fw-medium text-dark"
                    >-</span
                  >
                </div>
                <div class="d-flex justify-content-between">
                  <span
                    ><i class="bi bi-pencil-square me-1"></i> 最終更新:</span
                  >
                  <span id="updated_at_text" class="fw-medium text-dark"
                    >-</span
                  >
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          id="cancel_button"
          class="btn"
          data-bs-dismiss="modal"
        >
          キャンセル
        </button>
        <button
          type="submit"
          id="submit_button"
          form="user_form"
          class="btn text-white"
        >
          <i class="bi bi-check2-circle me-1"></i> 情報を保存する
        </button>
      </div>
    </div>
  </div>
</div>

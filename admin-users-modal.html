<div class="modal fade" id="userModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="userModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold text-dark" id="userModalLabel">ユーザー情報を登録</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body px-4 py-4">
        <form id="user_form" novalidate>
          <div class="row g-3">

            <!-- 姓 -->
            <div class="col-6">
              <label for="last_name" class="form-label">姓 <span class="text-danger">*</span></label>
              <input type="text" id="last_name" class="form-control" placeholder="例: 山田" maxlength="25" required />
              <div class="invalid-feedback small">姓を入力してください（25文字以内）。</div>
            </div>

            <!-- 名 -->
            <div class="col-6">
              <label for="first_name" class="form-label">名 <span class="text-danger">*</span></label>
              <input type="text" id="first_name" class="form-control" placeholder="例: 太郎" maxlength="25" required />
              <div class="invalid-feedback small">名を入力してください（25文字以内）。</div>
            </div>

            <!-- 氏名 -->
            <input type="hidden" id="user_name" />

            <div class="col-12">
              <label for="company_id" class="form-label">所属会社名 <span class="text-danger">*</span></label>
              <select id="company_id" class="form-select" required>
                <option value="" disabled selected>選択してください</option>
              </select>
              <div class="invalid-feedback small">所属会社を選択してください。</div>
            </div>

            <input type="hidden" id="avatar_url" value="assets/default-avatar.png" />

            <div class="col-12">
              <label for="login_email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
              <input type="email" id="login_email" class="form-control" placeholder="example@domain.com" required />
              <div class="invalid-feedback small" id="email_invalid_feedback">正しいメールアドレスを入力してください。</div>
              <div class="text-danger small mt-1" id="email_duplicate_feedback" style="display: none">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>このメールアドレスはすでに登録されています。
              </div>
            </div>

            <div class="col-12">
              <label for="password" class="form-label" id="password_label">パスワード <span
                  class="text-danger">*</span></label>

              <div id="password_group" class="input-group"
                style="border-radius: 10px; overflow: hidden; transition: all 0.2s ease">
                <input type="password" id="password" class="form-control py-2" placeholder="6〜20文字の半角英数字"
                  pattern="[a-zA-Z0-9]{6,20}" minlength="6" maxlength="20" required
                  style="font-size: 0.95rem; border: none !important; background-color: transparent !important; box-shadow: none !important" />
                <button class="btn px-3 bg-transparent" type="button" id="toggle_password_btn"
                  style="border: none !important; color: #6c757d !important; box-shadow: none !important">
                  <i class="bi bi-eye" id="toggle_password_icon"></i>
                </button>
              </div>

              <div class="invalid-feedback small mt-1">パスワードは6文字以上20文字以内の「半角英数字」で入力してください。</div>
            </div>

            <div class="col-12">
              <label for="role" class="form-label">権限レベル <span class="text-danger">*</span></label>
              <select id="role" class="form-select" required>
                <option value="staff" selected>一般ユーザー（自身の打刻・閲覧のみ）</option>
                <option value="admin">管理者（全ユーザーの管理が可能）</option>
              </select>
            </div>

            <div class="col-12">
              <label for="is_active" class="form-label fw-bold">アカウント状態 <span class="text-danger">*</span></label>
              <select id="is_active" class="form-select" required>
                <option value="true" selected>有効（ログイン可能・システム利用中）</option>
                <option value="false">無効（ログイン停止・退職者など）</option>
              </select>
            </div>

            <div class="col-12 mt-4" id="timestamps_area" style="display: none">
              <div class="p-3 bg-light rounded-3" style="font-size: 0.8rem; color: #64748b">
                <div class="d-flex justify-content-between mb-1">
                  <span><i class="bi bi-plus-circle me-1"></i> 作成日時:</span>
                  <span id="created_at_text" class="fw-medium text-dark">-</span>
                </div>
                <div class="d-flex justify-content-between">
                  <span><i class="bi bi-pencil-square me-1"></i> 最終更新:</span>
                  <span id="updated_at_text" class="fw-medium text-dark">-</span>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" id="cancel_button" class="btn" data-bs-dismiss="modal">閉じる</button>
        <button type="submit" id="submit_button" form="user_form" class="btn text-white">
          <i class="bi bi-check2-circle me-1"></i> 情報を保存する
        </button>
      </div>
    </div>
  </div>
</div>
